<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text format</title>
</head>

<body>
    <h1>Tags List</h1>
    <pre>
        1. b : bold tag
        2. i : italic tag
        3. u : underline tag
        5. sub : subscript tag
        6. sup : superscript tag
        7. del/s : deleted text tag
    </pre>
    <p>H<sub>2</sub>O</p>
    <p>2<sup>2</sup></p>
    <p>Lorem ipsum dolor sit amet <del>consectetur adipisicing</del> elit. Voluptatem, <s>voluptas?</s> </p>
</body>

</html>
